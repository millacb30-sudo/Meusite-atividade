<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de cadastro com Bootstrap e Bootstrap Icons.">
    <title>Cadastro - Minha loja</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #ffe4ec;
            color: #333;
            min-height: 100vh;
        }

        .navbar-rosa { background-color: #ffc2d1; }
        .navbar-rosa .navbar-brand { color: #6b2d3e; }

        /* Cartão do cadastro */
        .card-cadastro {
            max-width: 560px;
            width: 100%;
            border: none;
            border-radius: 1rem;
            box-shadow: 0 8px 24px rgba(214, 51, 132, 0.15);
        }

        .card-cadastro h1 { color: #6b2d3e; }

        /* Botão rosa */
        .btn-rosa {
            background-color: #d63384;
            border-color: #d63384;
            color: #fff;
        }
        .btn-rosa:hover {
            background-color: #b82a70;
            border-color: #b82a70;
            color: #fff;
        }

        /* Foco rosa nos campos */
        .form-control:focus,
        .form-select:focus {
            border-color: #d63384;
            box-shadow: 0 0 0 0.25rem rgba(214, 51, 132, 0.2);
        }

        .form-check-input:checked {
            background-color: #d63384;
            border-color: #d63384;
        }

        a { color: #d63384; }
        a:hover { color: #b82a70; }
    </style>
</head>
<body class="d-flex flex-column">

    <!-- Header simples -->
    <header>
        <nav class="navbar navbar-light navbar-rosa">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <i class="bi bi-heart-fill" style="color: #d63384;"></i> MeuSite
                </a>
            </div>
        </nav>
    </header>

    <!-- Conteúdo -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3 py-4">
        <div class="card card-cadastro">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill" style="font-size: 3rem; color: #d63384;"></i>
                    <h1 class="h3 mt-2">Crie sua conta</h1>
                    <p class="text-muted mb-0">Preencha os dados abaixo</p>
                </div>

                <form id="formCadastro" novalidate>

                    <!-- Nome completo -->
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome completo</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="nome"
                                   placeholder="Seu nome" minlength="3" required>
                            <div class="invalid-feedback">Digite seu nome completo.</div>
                        </div>
                    </div>

                    <!-- E-mail -->
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email"
                                   placeholder="seuemail@exemplo.com" required>
                            <div class="invalid-feedback">Digite um e-mail válido.</div>
                        </div>
                    </div>

                    <!-- Telefone e data de nascimento (lado a lado em telas médias+) -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="telefone" class="form-label">Telefone</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="tel" class="form-control" id="telefone"
                                       placeholder="(24) 99999-9999"
                                       pattern="\(\d{2}\) \d{4,5}-\d{4}" required>
                                <div class="invalid-feedback">Use o formato (24) 99999-9999.</div>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="nascimento" class="form-label">Data de nascimento</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
                                <input type="date" class="form-control" id="nascimento" required>
                                <div class="invalid-feedback">Informe a data.</div>
                            </div>
                        </div>
                    </div>

                    <!-- Estado -->
                    <div class="mb-3">
                        <label for="estado" class="form-label">Estado</label>
                        <select class="form-select" id="estado" required>
                            <option value="" selected disabled>Selecione...</option>
                            <option value="AC">Acre</option>
                            <option value="AL">Alagoas</option>
                            <option value="AP">Amapá</option>
                            <option value="AM">Amazonas</option>
                            <option value="BA">Bahia</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option>
                            <option value="ES">Espírito Santo</option>
                            <option value="GO">Goiás</option>
                            <option value="MA">Maranhão</option>
                            <option value="MT">Mato Grosso</option>
                            <option value="MS">Mato Grosso do Sul</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PA">Pará</option>
                            <option value="PB">Paraíba</option>
                            <option value="PR">Paraná</option>
                            <option value="PE">Pernambuco</option>
                            <option value="PI">Piauí</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="RO">Rondônia</option>
                            <option value="RR">Roraima</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="SP">São Paulo</option>
                            <option value="SE">Sergipe</option>
                            <option value="TO">Tocantins</option>
                        </select>
                        <div class="invalid-feedback">Selecione um estado.</div>
                    </div>

                    <!-- Gênero -->
                    <div class="mb-3">
                        <label class="form-label d-block">Gênero</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="genero" id="generoF" value="F" required>
                            <label class="form-check-label" for="generoF">Feminino</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="genero" id="generoM" value="M">
                            <label class="form-check-label" for="generoM">Masculino</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="genero" id="generoO" value="O">
                            <label class="form-check-label" for="generoO">Outro</label>
                        </div>
                    </div>

                    <!-- Senha -->
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="senha"
                                   placeholder="Mínimo de 6 caracteres" minlength="6" required>
                            <button class="btn btn-outline-secondary" type="button"
                                    id="btnMostrarSenha" aria-label="Mostrar ou ocultar senha">
                                <i class="bi bi-eye" id="iconeSenha"></i>
                            </button>
                            <div class="invalid-feedback">A senha deve ter pelo menos 6 caracteres.</div>
                        </div>
                    </div>

                    <!-- Confirmar senha -->
                    <div class="mb-3">
                        <label for="confirmarSenha" class="form-label">Confirmar senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="confirmarSenha"
                                   placeholder="Repita a senha" required>
                            <div class="invalid-feedback" id="erroConfirmar">As senhas não coincidem.</div>
                        </div>
                    </div>

                    <!-- Termos -->
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="termos" required>
                        <label class="form-check-label" for="termos">
                            Li e aceito os <a href="#">termos de uso</a>
                        </label>
                        <div class="invalid-feedback">Você precisa aceitar os termos.</div>
                    </div>

                    <!-- Botão -->
                    <button type="submit" class="btn btn-rosa w-100 py-2">
                        <i class="bi bi-check-circle"></i> Cadastrar
                    </button>
                </form>

                <p class="text-center mt-4 mb-0">
                    Já tem conta? <a href="login.html">Entrar</a>
                </p>

            </div>
        </div>
    </main>

    <!-- JavaScript do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const form = document.getElementById('formCadastro');
        const senha = document.getElementById('senha');
        const confirmar = document.getElementById('confirmarSenha');
        const telefone = document.getElementById('telefone');

        // Mostrar / ocultar senha
        document.getElementById('btnMostrarSenha').addEventListener('click', () => {
            const oculta = senha.type === 'password';
            senha.type = oculta ? 'text' : 'password';
            confirmar.type = senha.type;
            document.getElementById('iconeSenha').className = oculta ? 'bi bi-eye-slash' : 'bi bi-eye';
        });

        // Máscara do telefone: (24) 99999-9999
        telefone.addEventListener('input', () => {
            let v = telefone.value.replace(/\D/g, '').slice(0, 11);
            if (v.length > 10) {
                v = v.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
            } else if (v.length > 6) {
                v = v.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
            } else if (v.length > 2) {
                v = v.replace(/^(\d{2})(\d*)/, '($1) $2');
            } else if (v.length > 0) {
                v = v.replace(/^(\d*)/, '($1');
            }
            telefone.value = v;
        });

        // Confere se as senhas são iguais
        function conferirSenhas() {
            if (confirmar.value !== senha.value) {
                confirmar.setCustomValidity('As senhas não coincidem.');
            } else {
                confirmar.setCustomValidity('');
            }
        }
        senha.addEventListener('input', conferirSenhas);
        confirmar.addEventListener('input', conferirSenhas);

        // Validação no envio
        form.addEventListener('submit', (evento) => {
            evento.preventDefault();
            conferirSenhas();

            if (!form.checkValidity()) {
                evento.stopPropagation();
            } else {
                alert('Cadastro válido! Aqui você enviaria os dados ao servidor.');
            }

            form.classList.add('was-validated');
        });
    </script>
</body>
</html>
